<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel · Consultas y Reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #b8985a;
    --gold-l: #d4b87a;
    --dark: #1a1710;
    --dark2: #2c2a24;
    --cream: #faf7f2;
    --gray: #6b6760;
    --border: #e8e2d8;
    --white: #ffffff;
    --green: #22c55e;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --green-text: #166534;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    background-image:
      radial-gradient(ellipse at 15% 60%, rgba(184,152,90,.07) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(184,152,90,.04) 0%, transparent 50%);
  }

  /* ── PAGE LAYOUT ─────────────────────────────── */
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    gap: 20px;
  }

  .page-header {
    text-align: center;
  }
  .page-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 300;
    color: var(--dark);
    letter-spacing: .04em;
  }
  .page-header p {
    margin-top: 6px;
    font-size: 13.5px;
    color: var(--gray);
    font-weight: 300;
  }
  .gold-line {
    width: 48px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 12px auto 0;
  }

  /* ── CHAT CARD ───────────────────────────────── */
  .chat-card {
    width: 100%;
    max-width: 460px;
    background: var(--white);
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 12px 48px rgba(0,0,0,.10), 0 2px 0 rgba(184,152,90,.25);
    display: flex;
    flex-direction: column;
    height: clamp(500px, 70vh, 640px);
    overflow: hidden;
  }

  /* header */
  .chat-header {
    background: var(--dark);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    position: relative;
  }
  .chat-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 20px; right: 20px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(184,152,90,.5), transparent);
  }
  .h-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-l));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; color: var(--dark); font-weight: 600; flex-shrink: 0;
  }
  .h-info { flex: 1; }
  .h-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px; color: #fff; font-weight: 400; letter-spacing: .03em;
  }
  .h-status {
    display: flex; align-items: center; gap: 5px; margin-top: 2px;
  }
  .h-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  .h-sub { font-size: 11px; color: rgba(255,255,255,.45); letter-spacing: .04em; }
  .h-badge {
    font-size: 10px; color: var(--gold);
    border: 1px solid rgba(184,152,90,.35);
    padding: 2px 8px; border-radius: 20px; letter-spacing: .07em;
  }

  /* messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-row {
    display: flex;
    gap: 8px;
    animation: fadeUp .25s ease;
  }
  .msg-row.user { flex-direction: row-reverse; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .m-av {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500; align-self: flex-end;
  }
  .m-av.bot { background: #f0ede8; color: var(--gray); border: 1px solid var(--border); font-family: 'Cormorant Garamond', serif; font-size: 13px; }
  .m-av.user { background: var(--dark2); color: rgba(255,255,255,.7); }

  .bubble {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .bubble.bot {
    background: #f9f8f5;
    color: var(--dark);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .bubble.user {
    background: var(--dark2);
    color: #fff;
    border-bottom-right-radius: 3px;
  }
  .bubble.success {
    background: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green-text);
  }

  /* typing */
  .typing-bubble {
    padding: 10px 14px;
    background: #f9f8f5;
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 3px;
    display: flex; gap: 4px; align-items: center;
    width: fit-content;
  }
  .t-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
    animation: tdot 1.2s ease infinite;
  }
  .t-dot:nth-child(2){animation-delay:.2s}
  .t-dot:nth-child(3){animation-delay:.4s}
  @keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}

  /* quick replies */
  .qr-wrap { padding-left: 34px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .qr-btn {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 4px 12px; border-radius: 20px;
    font-size: 12px; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all .15s;
  }
  .qr-btn:hover { background: var(--gold); color: #fff; }

  /* contact card */
  .contact-card {
    margin-top: 10px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .contact-summary {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: var(--cream);
    border-bottom: 1px solid var(--border);
  }
  .cs-row {
    display: flex;
    gap: 8px;
    font-size: 12.5px;
    color: var(--dark);
  }
  .cs-row span:first-child { flex-shrink: 0; }
  .contact-divider {
    padding: 9px 14px;
    font-size: 11px;
    color: var(--gray);
    letter-spacing: .04em;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .contact-btns {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .contact-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    text-decoration: none;
    transition: all .15s;
    cursor: pointer;
  }
  .wa-btn {
    background: #25d366;
    color: #fff;
  }
  .wa-btn:hover { background: #1da851; }
  .mail-btn {
    background: transparent;
    color: var(--dark);
    border: 1px solid var(--border);
  }
  .mail-btn:hover { background: var(--cream); }
  .contact-note {
    padding: 0 14px 10px;
    font-size: 10.5px;
    color: #bbb;
    text-align: center;
  }

  /* handoff form (se mantiene por compatibilidad) */
  .hf-form {
    margin-top: 10px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .hf-label { font-size: 10.5px; color: var(--gray); letter-spacing: .05em; margin-bottom: 3px; }
  .hf-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    color: var(--dark);
    background: var(--cream);
    outline: none;
    transition: border-color .2s;
  }
  .hf-input:focus { border-color: var(--gold); }
  .hf-submit {
    background: var(--dark);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: background .2s;
    margin-top: 2px;
  }
  .hf-submit:hover { background: var(--gold); }
  .hf-submit:disabled { background: #ccc; cursor: not-allowed; }

  /* system divider */
  .sys-msg {
    text-align: center;
    font-size: 11px;
    color: #ccc;
    padding: 2px 0;
    letter-spacing: .03em;
  }

  /* input area */
  .input-area {
    padding: 10px 12px 13px;
    border-top: 1px solid var(--border);
    background: #fff;
    flex-shrink: 0;
  }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  .chat-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 9px 15px;
    font-size: 13.5px;
    font-family: 'DM Sans', sans-serif;
    color: var(--dark);
    background: var(--cream);
    outline: none;
    resize: none;
    line-height: 1.4;
    max-height: 90px;
    transition: border-color .2s;
  }
  .chat-input:focus { border-color: var(--gold); }
  .chat-input::placeholder { color: #c5c0b8; }
  .send-btn {
    width: 36px; height: 36px;
    border-radius: 50%; border: none;
    background: var(--dark); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .2s;
  }
  .send-btn:hover { background: var(--gold); }
  .send-btn:disabled { background: #ccc; cursor: not-allowed; }
  .input-hint {
    text-align: center; font-size: 10.5px;
    color: #ccc; margin-top: 7px; letter-spacing: .02em;
  }

  /* loading state */
  .loading-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
  }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loading-text { font-size: 12.5px; color: var(--gray); }

  /* ── PAGE FOOTER ─────────────────────────────── */
  .page-footer {
    font-size: 11px;
    color: #c0bab3;
    letter-spacing: .03em;
  }

  @media (max-width: 480px) {
    .page { padding: 16px 10px; justify-content: flex-start; padding-top: 30px; }
    .chat-card { height: calc(100vh - 120px); border-radius: 16px; }
  }
</style>
</head>
<body>

<main class="page">

  <div class="page-header">
    <h1>Hotel · Consultas</h1>
    <div class="gold-line"></div>
    <p>Consultá precios, habitaciones y hacé tu reserva</p>
  </div>

  <div class="chat-card">

    <div class="chat-header">
      <div class="h-avatar">H</div>
      <div class="h-info">
        <div class="h-name">Asistente del Hotel</div>
        <div class="h-status">
          <div class="h-dot"></div>
          <span class="h-sub">EN LÍNEA</span>
        </div>
      </div>
      <div class="h-badge">BETA</div>
    </div>

    <div class="messages" id="messages">
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <div class="loading-text">Conectando…</div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea
          class="chat-input"
          id="chatInput"
          placeholder="Escribí tu consulta…"
          rows="1"
          disabled
        ></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Solo consultas sobre habitaciones y precios · Powered by Claude</div>
    </div>

  </div>

  <div class="page-footer">© Hotel · Sistema de consultas</div>

</main>

<script>
// ── ESTADO ────────────────────────────────────────────
const STATE = {
  history: [],
  thinking: false,
  handoffStage: null,
  lastQuote: null,
  pendingHandoff: null,
};

function showHandoffCard() {
  if (!STATE.pendingHandoff) return;
  const { handoffData, hotelWhatsapp, hotelEmail } = STATE.pendingHandoff;
  STATE.pendingHandoff = null;
  STATE.handoffStage = 'done';
  const { bubble } = addRow('bot', 'Acá están los datos de tu consulta. Recordá que la disponibilidad se confirma con nuestro equipo:');
  bubble.innerHTML += buildContactButtons(handoffData, hotelWhatsapp, hotelEmail);
  addSys('— reserva lista para confirmar —');
}

const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('chatInput');
const sendBtn    = document.getElementById('sendBtn');

// ── HELPERS ───────────────────────────────────────────
function scrollBottom() {
  setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 60);
}

function addRow(role, html, extra = {}) {
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const av = document.createElement('div');
  av.className = `m-av ${role}`;
  av.textContent = role === 'bot' ? 'H' : '✦';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}${extra.success ? ' success' : ''}`;
  bubble.innerHTML = html;

  row.appendChild(av);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
  return { row, bubble };
}

function addSys(text) {
  const d = document.createElement('div');
  d.className = 'sys-msg';
  d.textContent = text;
  messagesEl.appendChild(d);
  scrollBottom();
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';
  const av = document.createElement('div');
  av.className = 'm-av bot';
  av.textContent = 'H';
  const b = document.createElement('div');
  b.className = 'typing-bubble';
  b.innerHTML = '<div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>';
  row.appendChild(av);
  row.appendChild(b);
  messagesEl.appendChild(row);
  scrollBottom();
}

function hideTyping() {
  document.getElementById('typingRow')?.remove();
}

function addQuickReplies(replies) {
  const lastRow = messagesEl.querySelector('.msg-row.bot:last-of-type');
  if (!lastRow) return;
  const wrap = document.createElement('div');
  wrap.className = 'qr-wrap';
  replies.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = r;
    btn.onclick = () => { wrap.remove(); processInput(r); };
    wrap.appendChild(btn);
  });
  lastRow.after(wrap);
  scrollBottom();
}

function setInputEnabled(enabled) {
  inputEl.disabled = !enabled;
  sendBtn.disabled = !enabled;
}

// ── API CALL ──────────────────────────────────────────
async function callAPI(messages, lastQuote = null) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, lastQuote })
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadChatConfig() {
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [], action: 'config' })
    });
    const data = await res.json();
    return data.config || {};
  } catch(e) { return {}; }
}

// ── CONTACT BUTTONS ───────────────────────────────────
function buildContactButtons(data, whatsapp, email) {
  const nombre    = data.nombre    || '';
  const checkin   = data.checkin   || '';
  const checkout  = data.checkout  || '';
  const hab       = data.habitacion|| '';
  const personas  = data.personas  || '';
  const precio    = data.precio    || '';
  const cama      = data.cama      || '';

  const msgText = [
    'Hola! Quiero hacer una reserva.',
    '',
    'Nombre: ' + nombre,
    'Habitacion: ' + hab + (cama ? ' (' + cama + ')' : ''),
    'Personas: ' + personas,
    'Check-in: ' + checkin,
    'Check-out: ' + checkout,
    precio ? 'Precio cotizado: ' + precio : '',
  ].filter(Boolean).join('\n');

  const waNum    = (whatsapp || '').replace(/\D/g, '');
  const waLink   = waNum ? `https://wa.me/${waNum}?text=${encodeURIComponent(msgText)}` : null;
  const mailSubj = `Reserva - ${nombre} - ${checkin} al ${checkout}`;
  const mailLink = email ? `mailto:${email}?subject=${encodeURIComponent(mailSubj)}&body=${encodeURIComponent(msgText)}` : null;

  const btnWa = waLink ? `
    <a href="${waLink}" target="_blank" class="contact-btn wa-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.112 1.523 5.837L.057 23.943l6.293-1.45A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.885 0-3.65-.518-5.166-1.42l-.371-.22-3.844.885.923-3.741-.241-.386A9.937 9.937 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
      Confirmar por WhatsApp
    </a>` : '';

  const btnMail = mailLink ? `
    <a href="${mailLink}" class="contact-btn mail-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      Confirmar por Email
    </a>` : '';

  return `
    <div class="contact-card">
      <div class="contact-summary">
        <div class="cs-row"><span>👤</span><span>${escHtml(nombre)}</span></div>
        <div class="cs-row"><span>🛏️</span><span>${escHtml(hab)}${cama ? ' · ' + escHtml(cama) : ''} · ${escHtml(personas)} personas</span></div>
        <div class="cs-row"><span>📅</span><span>${escHtml(checkin)} → ${escHtml(checkout)}</span></div>
        ${precio ? `<div class="cs-row"><span>💰</span><span>${escHtml(precio)}</span></div>` : ''}
      </div>
      <div class="contact-divider">¿Cómo preferís confirmar?</div>
      <div class="contact-btns">
        ${btnWa}
        ${btnMail}
      </div>
      <div class="contact-note">Al hacer click se abre con el mensaje pre-cargado con tus datos.</div>
    </div>`;
}

// ── PROCESS MESSAGE ───────────────────────────────────
async function processInput(text) {
  if (!text.trim() || STATE.thinking) return;
  STATE.thinking = true;
  setInputEnabled(false);

  document.querySelectorAll('.qr-wrap').forEach(el => el.remove());
  addRow('user', escHtml(text));
  showTyping();

  // Pasar lastQuote al historial como contexto para el handoff
  const historyToSend = STATE.lastQuote
    ? [...STATE.history, { role: 'system_hint', content: JSON.stringify(STATE.lastQuote) }]
    : STATE.history;
  const newHistory = [...STATE.history, { role: 'user', content: text }];

  try {
    const result = await callAPI(newHistory, STATE.lastQuote);
    const { reply, handoffData, quoteText, hotelWhatsapp, hotelEmail } = result;
    hideTyping();

    if (reply === 'QUOTE_BEFORE_HANDOFF' && handoffData) {
      STATE.history = newHistory;
      STATE.pendingHandoff = { handoffData, hotelWhatsapp, hotelEmail };

      // Mostrar cotización completa
      if (quoteText) {
        addRow('bot', escHtml(quoteText).replace(/\n/g, '<br>'));
      }

      // Preguntar si quiere confirmar
      const { bubble } = addRow('bot', '¿Querés confirmar la reserva?');
      const btnWrap = document.createElement('div');
      btnWrap.className = 'qr-wrap';
      btnWrap.style.marginTop = '8px';

      const btnSi = document.createElement('button');
      btnSi.className = 'qr-btn';
      btnSi.style.borderColor = 'var(--green)';
      btnSi.style.color = 'var(--green)';
      btnSi.textContent = 'Sí, confirmar';
      btnSi.onclick = () => {
        btnWrap.remove();
        showHandoffCard();
      };

      const btnNo = document.createElement('button');
      btnNo.className = 'qr-btn';
      btnNo.textContent = 'No, solo consultaba';
      btnNo.onclick = () => {
        btnWrap.remove();
        addRow('bot', '¡Perfecto! Si necesitás algo más, estoy acá.');
        addQuickReplies(['Consultar otras fechas', 'Ver habitaciones']);
        STATE.pendingHandoff = null;
      };

      btnWrap.appendChild(btnSi);
      btnWrap.appendChild(btnNo);
      bubble.appendChild(btnWrap);
      scrollBottom();

    } else if (reply === 'HANDOFF_READY' && handoffData) {
      STATE.handoffStage = 'done';
      STATE.history = newHistory;
      if (quoteText) addRow('bot', escHtml(quoteText).replace(/\n/g, '<br>'));
      const { bubble } = addRow('bot', 'Acá están los datos de tu consulta. Recordá que la disponibilidad se confirma con nuestro equipo:');
      bubble.innerHTML += buildContactButtons(handoffData, hotelWhatsapp, hotelEmail);
      addSys('— reserva lista para confirmar —');
    } else {
      STATE.history = [...newHistory, { role: 'assistant', content: reply }];

      // Guardar cotización en STATE si la respuesta tiene ese formato
      if (reply.includes('Check In:') && reply.includes('seña')) {
        const checkinM  = reply.match(/Check In:\s*([^\n\/]+)/);
        const checkoutM = reply.match(/Check Out:\s*([^\n]+)/);
        const tipoM     = reply.match(/Habitación:\s*([^\n]+)/);
        const precioM   = reply.match(/Total de la estadía:\s*([^\n]+)/);
        if (checkinM && checkoutM && tipoM) {
          STATE.lastQuote = {
            checkin:    checkinM[1].trim(),
            checkout:   checkoutM[1].trim(),
            habitacion: tipoM[1].trim(),
            precio:     precioM ? precioM[1].trim() : '',
            shown:      true,
          };
        }
      }

      const linkedReply = linkifyContacts(escHtml(reply).replace(/\n/g, '<br>'), hotelWhatsapp, hotelEmail);
      addRow('bot', linkedReply);

      const low = text.toLowerCase();
      if (low.match(/^(hola|buenas|buen|info)/)) {
        addQuickReplies(['Ver habitaciones', 'Consultar precios', 'Quiero reservar']);
      } else if (reply.toLowerCase().includes('doble') || reply.toLowerCase().includes('triple') || reply.toLowerCase().includes('precio')) {
        addQuickReplies(['Quiero reservar', 'Consultar otras fechas']);
      }
    }
  } catch(e) {
    hideTyping();
    addRow('bot', 'Hubo un problema al procesar tu consulta. Por favor intentá de nuevo.');
    console.error(e);
  }

  STATE.thinking = false;
  setInputEnabled(true);
  inputEl.focus();
}

// Convierte números de tel/WA y emails en links clickeables
function linkifyContacts(html, whatsapp, email) {
  if (whatsapp) {
    const waNum = whatsapp.replace(/\D/g, '');
    const waEsc = escHtml(whatsapp);
    html = html.split(waEsc).join(
      `<a href="https://wa.me/${waNum}" target="_blank" style="color:var(--gold);text-decoration:underline;">${waEsc}</a>`);
  }
  if (email) {
    const emailEsc = escHtml(email);
    html = html.split(emailEsc).join(
      `<a href="mailto:${emailEsc}" style="color:var(--gold);text-decoration:underline;">${emailEsc}</a>`);
  }
  return html;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── INIT ──────────────────────────────────────────────
async function init() {
  document.getElementById('loadingState').remove();
  setInputEnabled(true);
  inputEl.focus();

  // Cargar config pública del hotel
  const cfg = await loadChatConfig();

  // Nombre del hotel en header y página
  if (cfg.hotelName) {
    document.title = cfg.hotelName + ' · Consultas';
    const hName = document.querySelector('.h-name');
    if (hName) hName.textContent = 'Asistente de ' + cfg.hotelName;
    const h1 = document.querySelector('.page-header h1');
    if (h1) h1.textContent = cfg.hotelName + ' · Consultas';
    const footer = document.querySelector('.page-footer');
    if (footer) footer.textContent = '© ' + cfg.hotelName + ' · Sistema de consultas';
  }

  // Mensaje de bienvenida desde admin o default
  const welcomeMsg = cfg.welcomeMsg ||
    `¡Bienvenido/a! 🏨 Soy el asistente del hotel.<br><br>Puedo ayudarte con información sobre habitaciones, precios y conectarte con nuestro equipo para confirmar tu reserva.`;
  addRow('bot', welcomeMsg);
  addQuickReplies(['Ver habitaciones', 'Consultar precios', 'Quiero reservar']);
}

// Input handlers
sendBtn.addEventListener('click', () => {
  processInput(inputEl.value);
  inputEl.value = '';
  inputEl.style.height = 'auto';
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    processInput(inputEl.value);
    inputEl.value = '';
    inputEl.style.height = 'auto';
  }
});

inputEl.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 90) + 'px';
});

// Arrancar
init();
</script>
